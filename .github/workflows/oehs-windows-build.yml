name: OEHS Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/wpf-contract-entry-v0.5
      - feature/official-payment-document-templates
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WPF
        run: dotnet restore ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj"

      - name: Restore Tests
        run: dotnet restore ".\tests\OzelEgitimHakedis.Tests\OzelEgitimHakedis.Tests.csproj"

      - name: Restore WPF Output Tests
        run: dotnet restore ".\tests\OzelEgitimHakedis.Wpf.Tests\OzelEgitimHakedis.Wpf.Tests.csproj"

      - name: Verify Visual Studio 18 solution metadata
        shell: pwsh
        run: |
          $solution = Get-Content ".\OzelEgitimHakedisSistemi.sln" -Raw
          if (-not $solution.Contains("# Visual Studio Version 18")) { throw "Solution is not marked as Visual Studio 18." }
          if (-not $solution.Contains("VisualStudioVersion = 18.")) { throw "Expected a VisualStudioVersion value from the Visual Studio 18 family." }
          $projectOutput = dotnet sln ".\OzelEgitimHakedisSistemi.sln" list
          if ($LASTEXITCODE -ne 0) { throw "dotnet sln could not parse OzelEgitimHakedisSistemi.sln." }
          $projects = @($projectOutput | Where-Object { $_ -match "\.csproj\s*$" })
          if ($projects.Count -ne 4) { throw "Expected four projects in the solution; found $($projects.Count)." }

      - name: Build full solution
        run: dotnet build ".\OzelEgitimHakedisSistemi.sln" --configuration Release --no-restore

      - name: Build WPF
        run: dotnet build ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj" --configuration Release --no-restore

      - name: Verify WPF output UI contract
        shell: pwsh
        run: |
          $xaml = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml" -Raw
          $code = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml.cs" -Raw
          $statusCount = ([regex]::Matches($xaml, 'Text="KAYIT DURUMU"')).Count
          if ($statusCount -ne 1) { throw "Expected one dynamic header save-status label; found $statusCount." }
          if ($xaml -notmatch 'dört ayrı, tek sayfalı PDF') { throw "Output page description does not match the four-PDF save behavior." }
          if ($xaml -notmatch 'x:Name="HeaderSaveStatusTextBlock"' -or $xaml -notmatch 'x:Name="HeaderSaveStatusDot"') { throw "Dynamic save-status controls are missing." }
          if ($code -notmatch 'SetHeaderSaveStatus\("Kaydedildi"' -or $code -notmatch 'SetHeaderSaveStatus\("Veri yükleme hatası"') { throw "Load/save status update paths are missing." }

      - name: Verify compact UI layout
        shell: pwsh
        run: |
          $xaml = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml" -Raw
          $app = Get-Content ".\src\OzelEgitimHakedis.Wpf\App.xaml" -Raw
          $sidebarColumns = ([regex]::Matches($xaml, '<ColumnDefinition Width="215"/>')).Count
          if ($sidebarColumns -ne 2) { throw "Expected both app-shell and header sidebar columns to be 215 DIP; found $sidebarColumns." }
          if (-not $xaml.Contains('<Grid Width="48" Height="48">')) { throw "The readiness ring container must be 48x48 DIP so its arc is not vertically clipped." }
          if (-not $xaml.Contains('Text="YÜKLENİCİ FİRMALAR"')) { throw "The long contractor navigation label is missing." }
          if ($app -notmatch '<Style x:Key="NavButton"[\s\S]*?<Setter Property="Height" Value="40"/>') { throw "Navigation button height no longer matches the compact layout." }
          if ($app -notmatch '<Style x:Key="PageTitle"[\s\S]*?<Setter Property="FontSize" Value="19.5"/>') { throw "Page title typography was not reduced to the compact target." }

      - name: Verify archive edits and workflow roadmap
        shell: pwsh
        run: |
          $code = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml.cs" -Raw
          $xaml = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml" -Raw
          $archiveTests = Get-Content ".\tests\OzelEgitimHakedis.Tests\ProgressPaymentArchiveStoreTests.cs" -Raw
          if (-not $code.Contains("değişiklikleri uygulansın mı?")) { throw "Archive edit confirmation prompt is missing." }
          if (-not $code.Contains("Calculation = ProgressPaymentCalculator.Calculate(updatedArchive.ProgressPayment.Input)")) { throw "Archive edits must recalculate the payment from saved inputs before replacement." }
          if (-not $code.Contains("_archiveStore.Replace(_editingArchiveSourcePath, updatedArchive)")) { throw "Archive edits must replace the selected file rather than creating a new revision." }
          if (-not $code.Contains("private void ClearProgressEntryFields()")) { throw "Archive progress-edit inputs must be cleared after successful save." }
          if (-not $xaml.Contains("İŞ AKIŞI / İLERLEME ŞABLONU")) { throw "The clickable workflow roadmap is missing from the home screen." }
          foreach ($step in @('Tag="Contract"', 'Tag="Contractors"', 'Tag="Lines"', 'Tag="Progress"', 'Tag="Archives"', 'Tag="Reports"')) {
            if (-not $xaml.Contains($step)) { throw "Workflow roadmap navigation target is missing: $step" }
          }
          if (-not $archiveTests.Contains("Replace_ShouldOverwriteSameArchiveFileWithRecalculatedPaymentAndKeepRevision")) { throw "Same-file, same-revision recalculated archive replacement is not covered by a test." }

      - name: Build Tests
        run: dotnet build ".\tests\OzelEgitimHakedis.Tests\OzelEgitimHakedis.Tests.csproj" --configuration Release --no-restore

      - name: Build WPF Output Tests
        run: dotnet build ".\tests\OzelEgitimHakedis.Wpf.Tests\OzelEgitimHakedis.Wpf.Tests.csproj" --configuration Release --no-restore

      - name: Test Solution
        run: dotnet test ".\tests\OzelEgitimHakedis.Tests\OzelEgitimHakedis.Tests.csproj" --configuration Release --no-build --no-restore

      - name: Generate and verify PDF smoke files
        run: .\scripts\Generate-OfficialPdfSmoke.ps1 -OutputDirectory ".\artifacts\OEHS-PDF-Smoke"

      - name: Upload PDF smoke outputs for visual review
        id: upload_pdf_smoke
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OEHS-PDF-Smoke-Review
          path: artifacts/OEHS-PDF-Smoke/*.pdf
          if-no-files-found: error
          retention-days: 3

      - name: Report PDF smoke artifact limitation
        if: steps.upload_pdf_smoke.outcome == 'failure'
        run: echo "::warning::PDF smoke tests may have passed, but GitHub Actions could not store the sample PDFs. The storage quota may be full."

      - name: Publish Windows EXE
        run: >
          dotnet publish ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ".\artifacts\OEHS"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload OEHS EXE
        id: upload_oehs_exe
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OEHS-Windows-x64
          path: artifacts/OEHS/
          retention-days: 3

      - name: Report artifact upload limitation
        if: steps.upload_oehs_exe.outcome == 'failure'
        run: echo "::warning::Build, tests, and publish succeeded, but GitHub Actions could not store the binary because artifact storage may be full. Free storage or download locally with the OEHS packaging script."
