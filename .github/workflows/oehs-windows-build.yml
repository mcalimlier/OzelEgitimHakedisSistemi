name: OEHS Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/wpf-contract-entry-v0.5
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Solution
        run: dotnet restore ".\OzelEgitimHakedisSistemi.sln"

      - name: Build Solution
        run: dotnet build ".\OzelEgitimHakedisSistemi.sln" --configuration Release --no-restore

      - name: Test Solution
        run: dotnet test ".\OzelEgitimHakedisSistemi.sln" --configuration Release --no-build --no-restore

      - name: Publish Windows EXE
        run: >
          dotnet publish ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ".\artifacts\OEHS"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload OEHS EXE
        uses: actions/upload-artifact@v4
        with:
          name: OEHS-Windows-x64
          path: artifacts/OEHS/
          retention-days: 14
