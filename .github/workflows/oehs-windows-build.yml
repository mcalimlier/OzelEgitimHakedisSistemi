name: OEHS Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/wpf-contract-entry-v0.5
      - feature/official-payment-document-templates
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore WPF
        run: dotnet restore ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj"

      - name: Restore Tests
        run: dotnet restore ".\tests\OzelEgitimHakedis.Tests\OzelEgitimHakedis.Tests.csproj"

      - name: Restore WPF Output Tests
        run: dotnet restore ".\tests\OzelEgitimHakedis.Wpf.Tests\OzelEgitimHakedis.Wpf.Tests.csproj"

      - name: Verify Visual Studio 18 solution metadata
        shell: pwsh
        run: |
          $solution = Get-Content ".\OzelEgitimHakedisSistemi.sln" -Raw
          if (-not $solution.Contains("# Visual Studio Version 18")) { throw "Solution is not marked as Visual Studio 18." }
          if (-not $solution.Contains("VisualStudioVersion = 18.")) { throw "Expected a VisualStudioVersion value from the Visual Studio 18 family." }
          $projectOutput = dotnet sln ".\OzelEgitimHakedisSistemi.sln" list
          if ($LASTEXITCODE -ne 0) { throw "dotnet sln could not parse OzelEgitimHakedisSistemi.sln." }
          $projects = @($projectOutput | Where-Object { $_ -match "\.csproj\s*$" })
          if ($projects.Count -ne 4) { throw "Expected four projects in the solution; found $($projects.Count)." }

      - name: Build full solution
        run: dotnet build ".\OzelEgitimHakedisSistemi.sln" --configuration Release --no-restore

      - name: Build WPF
        run: dotnet build ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj" --configuration Release --no-restore

      - name: Verify WPF output UI contract
        shell: pwsh
        run: |
          $xaml = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml" -Raw
          $code = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml.cs" -Raw
          $statusCount = ([regex]::Matches($xaml, 'Text="KAYIT DURUMU"')).Count
          if ($statusCount -ne 1) { throw "Expected one dynamic header save-status label; found $statusCount." }
          if ($xaml -notmatch 'dört ayrı, tek sayfalı PDF') { throw "Output page description does not match the four-PDF save behavior." }
          if ($xaml -notmatch 'x:Name="HeaderSaveStatusTextBlock"' -or $xaml -notmatch 'x:Name="HeaderSaveStatusDot"') { throw "Dynamic save-status controls are missing." }
          if ($code -notmatch 'SetHeaderSaveStatus\("Kaydedildi"' -or $code -notmatch 'SetHeaderSaveStatus\("Veri yükleme hatası"') { throw "Load/save status update paths are missing." }

      - name: Verify compact UI layout
        shell: pwsh
        run: |
          $xaml = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml" -Raw
          $app = Get-Content ".\src\OzelEgitimHakedis.Wpf\App.xaml" -Raw
          $sidebarColumns = ([regex]::Matches($xaml, '<ColumnDefinition Width="215"/>')).Count
          if ($sidebarColumns -ne 2) { throw "Expected both app-shell and header sidebar columns to be 215 DIP; found $sidebarColumns." }
          if (-not $xaml.Contains('<Grid Width="48" Height="48">')) { throw "The readiness ring container must be 48x48 DIP so its arc is not vertically clipped." }
          if (-not $xaml.Contains('Text="YÜKLENİCİ FİRMALAR"')) { throw "The long contractor navigation label is missing." }
          if ($app -notmatch '<Style x:Key="NavButton"[\s\S]*?<Setter Property="Height" Value="40"/>') { throw "Navigation button height no longer matches the compact layout." }
          if ($app -notmatch '<Style x:Key="PageTitle"[\s\S]*?<Setter Property="FontSize" Value="19.5"/>') { throw "Page title typography was not reduced to the compact target." }

      - name: Verify archive edits and workflow roadmap
        shell: pwsh
        run: |
          $code = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml.cs" -Raw
          $xaml = Get-Content ".\src\OzelEgitimHakedis.Wpf\MainWindow.xaml" -Raw
          $archiveTests = Get-Content ".\tests\OzelEgitimHakedis.Tests\ProgressPaymentArchiveStoreTests.cs" -Raw
          if (-not $code.Contains("değişiklikleri uygulansın mı?")) { throw "Archive edit confirmation prompt is missing." }
          if (-not $code.Contains("Calculation = ProgressPaymentCalculator.Calculate(updatedArchive.ProgressPayment.Input, _calculationConstants)")) { throw "Archive edits must recalculate the payment from saved inputs using the current persisted calculation constants before replacement." }
          if (-not $code.Contains("_archiveStore.SaveRevision(_editingArchiveSourcePath, updatedArchive)")) { throw "Archive edits must create an immutable new revision and preserve prior revisions." }
          if (-not $code.Contains("private void ClearProgressEntryFields(bool clearTenderSelection = true)")) { throw "Archive and new-payment entry forms must clear after save/reset." }
          if ($code -notmatch 'UpdateAcceptanceView\(\);[\s\S]{0,320}ClearContractFormOnly\(\);') { throw "The contract input form must clear after a successful save and view refresh." }
          if ($code -notmatch 'SetContractorEditorMode\(false\);\s*ContractorStatusTextBlock.Text = "Yeni firma kaydı için alanlar temizlendi\."') { throw "The contractor form must return to create mode after save." }
          if (-not $code.Contains("Keep the chosen tender/contractor filters")) { throw "Clearing the route form must preserve context for its right-hand saved-record list." }
          if ($code -notmatch 'ArchiveStatusTextBlock\.Text = "ARŞİV OLUŞTURULDU"[\s\S]{0,900}ClearProgressEntryFields\(\)[\s\S]{0,120}SetProgressEditorMode\(false\)') { throw "The payment form must clear after a successful archive save." }
          if ($code -notmatch 'SetRouteEditorMode\(false\);') { throw "The route editor must return to create mode after clearing." }
          if (-not $xaml.Contains("İŞ AKIŞI / İLERLEME ŞABLONU")) { throw "The clickable workflow roadmap is missing from the home screen." }
          foreach ($step in @('Tag="Contract"', 'Tag="Contractors"', 'Tag="Lines"', 'Tag="Progress"', 'Tag="Archives"', 'Tag="Reports"')) {
            if (-not $xaml.Contains($step)) { throw "Workflow roadmap navigation target is missing: $step" }
          }
          if ($code -notmatch 'private void ConfigureArchiveCorrectionChangeTracking\(\)') { throw "Archive edit field change tracking is missing." }
          if (-not $code.Contains("DEĞİŞİKLİK ALGILANDI") -or $code -notmatch 'UpdateProgressCalculationDisplay\(calculation, input\.WorkDays\)') { throw "Live archive correction status and net payment preview are missing." }
          $loadMethod = [regex]::Match($code, 'private void LoadPersistedData\(\)[\s\S]*?(?=\n    private )').Value
          if (-not $loadMethod.Contains("ClearContractFormOnly();")) { throw "Persisted tender data must not remain in the editable contract form on startup." }
          if ($code -notmatch 'private void UpdateProgressContractorAndRoutes\(ContractDraftData\? contract, bool preserveSelection = true\)') { throw "Progress route selection must be explicit instead of defaulting to the first route." }
          if ($code -match 'ProgressRouteComboBox\.SelectedIndex\s*=\s*0') { throw "The payment form must not automatically select the first route." }
          if ($code -notmatch 'private void ResetEditorUiToCreateMode\(\)[\s\S]{0,1600}ProgressRouteComboBox\.IsEnabled = true;') { throw "Payment route selection must be re-enabled after leaving archive correction mode." }
          if (-not $code.Contains("ProgressTenderListBox.SelectedItem = progressContract;")) { throw "The payment tender selector must preserve only an explicitly selected contract and remain blank on launch." }
          if (-not $code.Contains("private void BeginHistoryOrArchiveCorrection(ProgressPaymentHistoryData item)")) { throw "History edits must resolve archived payments to their authoritative archive record." }
          if (-not $code.Contains("_progressHistory[matchingHistoryIndex] = recalculatedPayment;")) { throw "Approved archive corrections must update the matching primary history row." }
          if (-not $code.Contains("private void RefreshHistoryCorrectionStatus()")) { throw "Non-archived history corrections must refresh the live status and calculation preview." }
          if (-not $code.Contains("private bool ConfirmLiveHistoryCorrection(")) { throw "Non-archived corrections must require confirmation before overwriting history." }
          if (-not $code.Contains("private void RefreshViewsAfterHistoryCorrection()")) { throw "Corrected history must refresh summary, report, and progress views." }
          if (-not $code.Contains('ConfirmLiveHistoryCorrection("Hakediş girdileri", historyItem)')) { throw "Editing a history payment must ask for confirmation before replacing its existing row." }
          if ($code -notmatch 'if \(clearTenderSelection\)[\s\S]{0,220}ProgressRouteComboBox\.ItemsSource = Array\.Empty<RouteDraft>\(\);') { throw "Clearing a fresh payment form must also clear stale route choices when the tender is cleared." }
          if (-not $archiveTests.Contains("SaveRevision_ShouldCreateV02AndKeepV01ForRecalculatedPayment")) { throw "Archive correction must create v02 and preserve v01 in a regression test." }
          if (-not $archiveTests.Contains("SaveRevision_ShouldCreateNewRevisionAndPreserveOriginalWhenRouteChanges")) { throw "Archive identity corrections must preserve the earlier revision." }

      - name: Build Tests
        run: dotnet build ".\tests\OzelEgitimHakedis.Tests\OzelEgitimHakedis.Tests.csproj" --configuration Release --no-restore

      - name: Build WPF Output Tests
        run: dotnet build ".\tests\OzelEgitimHakedis.Wpf.Tests\OzelEgitimHakedis.Wpf.Tests.csproj" --configuration Release --no-restore

      - name: Test Solution
        run: dotnet test ".\tests\OzelEgitimHakedis.Tests\OzelEgitimHakedis.Tests.csproj" --configuration Release --no-build --no-restore

      - name: Generate and verify PDF smoke files
        run: .\scripts\Generate-OfficialPdfSmoke.ps1 -OutputDirectory ".\artifacts\OEHS-PDF-Smoke"

      - name: Upload PDF smoke outputs for visual review
        id: upload_pdf_smoke
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OEHS-PDF-Smoke-Review
          path: artifacts/OEHS-PDF-Smoke/*.pdf
          if-no-files-found: error
          retention-days: 3

      - name: Report PDF smoke artifact limitation
        if: steps.upload_pdf_smoke.outcome == 'failure'
        run: echo "::warning::PDF smoke tests may have passed, but GitHub Actions could not store the sample PDFs. The storage quota may be full."

      - name: Publish Windows EXE
        run: >
          dotnet publish ".\src\OzelEgitimHakedis.Wpf\OzelEgitimHakedis.Wpf.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ".\artifacts\OEHS"
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload OEHS EXE
        id: upload_oehs_exe
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: OEHS-Windows-x64
          path: artifacts/OEHS/
          retention-days: 3

      - name: Report artifact upload limitation
        if: steps.upload_oehs_exe.outcome == 'failure'
        run: echo "::warning::Build, tests, and publish succeeded, but GitHub Actions could not store the binary because artifact storage may be full. Free storage or download locally with the OEHS packaging script."
